name: Validate template
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full_runtime:
        description: Run disposable Docker servers, backups and restore
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  local:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: ./scripts/validate local
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: local-validation
          path: validation-output/
  runtime:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.full_runtime)
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: ./scripts/validate fullDocker
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: runtime-validation
          path: validation-output/
