name: Validate template
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full_runtime:
        description: Run disposable Docker servers, backups and restore
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  local:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: ./scripts/validate local
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: local-validation
          path: validation-output/
  runtime:
    if: github.event_name == 'workflow_dispatch' && inputs.full_runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: ./scripts/validate fullDocker
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: runtime-validation
          path: validation-output/
