name: Verify pinned versions
on:
  workflow_dispatch:
  schedule:
    - cron: '19 8 * * 1'
  pull_request:
    paths: [versions.env, scripts/check-versions]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: mkdir -p validation-output && ./scripts/check-versions > validation-output/version-check.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: version-verification
          path: validation-output/
